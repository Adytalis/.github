name: Bug
description: Something in an Adytalis app doesn't work as it should.
labels: ["type:bug"]
assignees: ["HaveryDev"]
body:
  - type: input
    id: version
    attributes:
      label: App and version
      description: The app's name and version (usually in Settings › About).
      placeholder: "Adexix 0.1.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Device and operating system
      placeholder: "MacBook Air, macOS 15.1"
  - type: textarea
    id: steps
    attributes:
      label: What you did, step by step
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: A screenshot helps. Never paste passwords, tokens or recovery codes.
    validations:
      required: true
