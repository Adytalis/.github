name: Feature
description: Something an Adytalis app should do.
labels: ["type:feature"]
assignees: ["HaveryDev"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem or the job
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working. Sketches and examples welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
